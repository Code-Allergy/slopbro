<!DOCTYPE html>

<html><head><meta charset="UTF-8"><title>SlopBro</title>
<meta name="referrer" content="no-referrer">
<style>body{background:#111;color:#eee;font:20px sans-serif;margin:2em}#error{color:#ff9090}#status{color:#aaffaa}</style>
</head><body><h1>SlopBro</h1><p id="status">Checking prerequisites…</p><p id="error"></p>
<script>
(function () {
    'use strict';
    var expected = ['autoroot.sh', 'hbchannel-startup.sh', 'hbchannel.ipk', 'luna-helper.js', 'main.js', 'package.json'];
    var packageHash = 'd10bf3c753551d7c72fb7a92b20fcd2317e502a220ac668ba8e76f6ea78b363c';
    var status = document.getElementById('status');
    var error = document.getElementById('error');
    var stopped = false, bridges = [], timers = [], manifest, directory, baseUrl;

    function fail(message) {
        if (stopped) return;
        stopped = true;
        error.textContent = message;
        status.textContent = 'Stopped. Check the launcher and installer state before retrying.';
        timers.forEach(function (timer) { clearTimeout(timer); });
        bridges.forEach(function (bridge) { try { bridge.cancel(); } catch (ignored) {} });
        // A negative receipt is useful even when not all assets were requested.
        if (baseUrl) {
            var receipt = new XMLHttpRequest();
            receipt.open('POST', baseUrl + 'result', true);
            receipt.setRequestHeader('Content-Type', 'application/json');
            receipt.timeout = 5000;
            receipt.send(JSON.stringify({ok: false, root_verified: false, phase: 'page', error: message}));
        }
    }
    function bridge() {
        var value = null;
        if (typeof webOSServiceBridge === 'function') value = new webOSServiceBridge();
        else if (typeof PalmServiceBridge === 'function') value = new PalmServiceBridge();
        if (value === null) fail('The webOS service bridge is unavailable.');
        else bridges.push(value); // Retain native objects until their requests end.
        return value;
    }
    function parse(message) {
        try {
            var result = JSON.parse(message);
            if (!result || typeof result !== 'object' || Array.isArray(result)) throw new Error('object required');
            return result;
        } catch (ignored) { fail('Invalid service response.'); return null; }
    }
    function runService() {
        if (stopped) return;
        var service = bridge();
        if (!service) return;
        var args = ['--', '/tmp/run-js-service-no-cgroup', '^_~', directory,
                    directory + '/autoroot.sh', btoa(JSON.stringify(manifest)), baseUrl + 'result'];
        var query = location.search.substring(1).split('&');
        for (var i = 0; i < query.length; i++) {
            var pair = query[i].split('=');
            if (pair[0] === 'fake-service-path') {
                var fakePath;
                try { fakePath = decodeURIComponent(pair[1] || ''); }
                catch (ignored) { fail('Invalid service path.'); return; }
                if (!/^\/[A-Za-z0-9_./-]+$/.test(fakePath) || fakePath.split('/').indexOf('..') !== -1) {
                    fail('Invalid service path.'); return;
                }
                args.unshift('a', 'b', 'c', fakePath);
            }
        }
        service.onservicecallback = function (message) {
            if (stopped) return;
            var response = parse(message);
            if (!response) return;
            if (response.returnValue !== true) { fail('The installer service failed to start.'); return; }
            status.textContent = 'Installer started. Wait for a verified result in the computer launcher.';
        };
        status.textContent = 'Starting the installer…';
        service.call('luna://com.webos.service.jsserver/run', JSON.stringify({inputParams: args.join(' ')}));
    }
    function download(index) {
        if (stopped) return;
        if (index === expected.length) { runService(); return; }
        var file = expected[index], service = bridge(), complete = false;
        if (!service) return;
        status.textContent = 'Downloading ' + file;
        var timer = setTimeout(function () { fail('Download timed out: ' + file); }, 30000);
        timers.push(timer);
        service.onservicecallback = function (message) {
            if (complete || stopped) return;
            var response = parse(message);
            if (!response) return;
            // Completion may arrive with the subscription acknowledgement.
            // completed:false is a progress update, not a terminal failure.
            if (response.returnValue === false || response.aborted === true || response.interrupted === true) {
                fail('Download failed: ' + file); return;
            }
            if (response.completed === true) {
                if (typeof response.httpStatus !== 'number' || response.httpStatus < 200 || response.httpStatus >= 300) {
                    fail('Download returned an HTTP error: ' + file); return;
                }
                complete = true;
                clearTimeout(timer);
                service.cancel();
                download(index + 1);
            }
        };
        service.call('luna://com.webos.service.downloadmanager/download', JSON.stringify({
            target: baseUrl + file, targetDir: directory, targetFilename: file, subscribe: true
        }));
    }
    if (location.protocol !== 'https:') { fail('A trusted HTTPS connection is required.'); return; }
    var sessionPath = /^\/([0-9a-f]{64})\/index\.html$/.exec(location.pathname);
    if (!sessionPath) { fail('Invalid session URL.'); return; }
    baseUrl = location.origin + '/' + sessionPath[1] + '/';
    directory = '/media/internal/downloads/slopbro-' + sessionPath[1];
    var request = new XMLHttpRequest();
    request.open('GET', baseUrl + 'manifest.json', true);
    request.timeout = 10000;
    request.onerror = request.ontimeout = function () { fail('Could not fetch the authenticated manifest.'); };
    request.onload = function () {
        if (stopped) return;
        try {
            if (request.status !== 200) throw new Error('HTTP error');
            manifest = JSON.parse(request.responseText);
            if (!manifest || manifest.session !== sessionPath[1] || manifest.package_sha256 !== packageHash ||
                !Array.isArray(manifest.files) || manifest.files.slice().sort().join(',') !== expected.join(',') ||
                !manifest.sha256 || typeof manifest.sha256 !== 'object') throw new Error('bad manifest');
            expected.forEach(function (file) {
                if (!/^[0-9a-f]{64}$/.test(manifest.sha256[file])) throw new Error('bad digest');
            });
            if (manifest.sha256['hbchannel.ipk'] !== packageHash) throw new Error('unexpected package');
        } catch (ignored) { fail('Invalid authenticated manifest.'); return; }
        download(0);
    };
    request.send();
})();
</script></body></html>
